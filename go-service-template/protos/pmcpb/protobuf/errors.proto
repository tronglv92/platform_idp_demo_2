syntax = "proto3";

package pmcpb.protobuf;

option go_package = "go-service-template/helper/pmcpb/protobuf;pmcpb";

import "google/protobuf/descriptor.proto";

message Status {
  int32 code = 1;
  string reason = 2;
  string message = 3;
  map<string, string> metadata = 4;
};

extend google.protobuf.EnumOptions { int32 default_code = 1108; }

extend google.protobuf.EnumValueOptions { int32 code = 1109; }